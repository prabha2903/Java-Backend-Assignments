# ============================================================
# Datasource (read manually by HibernateConfig - NOT used by
# Spring Data JPA / Spring auto-configured DataSource, since
# DataSourceAutoConfiguration is excluded in the main class).
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/student_course_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=prabhapounraj@07
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8080

# ============================================================
# Pure Hibernate configuration (consumed programmatically in
# com.prabha.student_course_registration.config.HibernateConfig)
# ============================================================
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.connection.pool_size=10
