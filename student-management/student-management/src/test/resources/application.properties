# Test-only configuration.
# Overrides the main MySQL datasource with an in-memory H2 database so that
# the test suite (including the Spring context-load test) can run without
# requiring a real MySQL server.
spring.datasource.url=jdbc:h2:mem:studentdb_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
