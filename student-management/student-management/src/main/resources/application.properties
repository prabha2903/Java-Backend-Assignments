# ===================================================================
# Application
# ===================================================================
spring.application.name=student-management
server.port=8080

# ===================================================================
# MySQL Datasource
# Update the username/password to match your local MySQL installation.
# createDatabaseIfNotExist=true means you do NOT have to manually run
# "CREATE DATABASE studentdb;" first -- the driver will create it for you
# the first time the application connects (as long as the MySQL user has
# the CREATE privilege).
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=prabhapounraj@07
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Jackson
# ===================================================================
spring.jackson.default-property-inclusion=non_null
