spring.application.name=employee-passport-mapping
server.port=8080

# ---------------------------------------------------
# Datasource (used manually by HibernateConfig - NOT Spring Data JPA)
# ---------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/employee_passport_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=prabhapounraj@07
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------
# Pure Hibernate configuration (read manually in HibernateConfig)
# NOTE: these are plain custom keys, NOT spring.jpa.* on purpose,
# because Spring Data JPA auto-configuration is intentionally NOT used.
# ---------------------------------------------------
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.use_sql_comments=true
